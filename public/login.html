<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Micro Front-End</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-brand">Micro Front-End</div>
                <ul class="nav-menu">
                    <li><a href="/" class="nav-link">Home</a></li>
                    <li><a href="/login.html" class="nav-link active">Login</a></li>
                </ul>
            </div>
        </nav>

        <main class="container">
            <section class="login-section">
                <div class="login-card">
                    <h1>Login</h1>
                    <p class="subtitle">Sign in to access your dashboard</p>
                    
                    <form id="loginForm" class="login-form">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required placeholder="Enter your email">
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required placeholder="Enter your password">
                        </div>
                        
                        <div id="error-message" class="error-message" style="display: none;"></div>
                        
                        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
                    </form>
                    
                    <p class="form-footer">
                        Demo credentials: <strong>demo@example.com</strong> / <strong>password123</strong>
                    </p>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Micro Front-End. All rights reserved.</p>
        </footer>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
